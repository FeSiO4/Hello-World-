# =============================================================================
# Package a lightweight Java program into a Windows .exe (jpackage app-image)
# and upload the folder as an artifact.  Independent of the Maven/JavaFX build.
# Triggered by push; also runnable manually.
# =============================================================================
name: package-exe

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile the lightweight demo
        run: |
          mkdir -p classes
          javac -d classes exe-demo/Main.java
          jar --create --file app.jar --main-class Main -C classes .

      - name: Package to Windows exe (app-image, no installer)
        run: |
          jpackage --type app-image `
            --name HelloExe `
            --input . `
            --main-jar app.jar `
            --main-class Main `
            --dest dist

      - name: Show what was produced
        run: |
          Get-ChildItem -Recurse dist | Select-Object FullName
          Write-Host "--- exe found? ---"
          Test-Path "dist\HelloExe\HelloExe.exe"

      - name: Upload exe app-image
        uses: actions/upload-artifact@v4
        with:
          name: HelloExe-windows
          path: dist/HelloExe
          if-no-files-found: error
