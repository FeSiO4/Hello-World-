# =============================================================================
# GitHub Actions · Hello-World (Java + JavaFX)
# Triggered automatically on every push to `main`. Compiles, packages and
# exposes the runnable fat jar as a downloadable artifact.
#
# Check it live:  Repo -> Actions tab -> "<job name>" run -> Artifacts
# =============================================================================
name: build-hello-world

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:          # lets you press "Run workflow" manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven (compile + package shaded jar)
        run: mvn -B -ntp clean package

      - name: Validate artifact exists
        run: test -f target/hello-world-1.0.0.jar && echo "jar OK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-jar
          path: target/hello-world-1.0.0.jar
          if-no-files-found: error
